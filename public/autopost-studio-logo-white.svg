<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" fill="none">
  <!-- AutoPost Studio by CabaLink Official Vector Logo (White version for dark canvas) -->
  <g id="emblem" transform="translate(185, 8)">
    <!-- 'O' Outer Circle Loop -->
    <path d="M 68 8
             C 106 8 136 38 136 76
             C 136 102 121 124 100 135
             L 76 96
             C 87 90 94 79 94 66
             C 94 48 79 33 60 33
             C 41 33 26 48 26 66
             C 26 79 33 90 44 96
             L 20 135
             C -1 124 -16 102 -16 76
             C -16 38 14 8 52 8 Z" 
          fill="#ffffff" />

    <!-- 'P' Connected Element -->
    <path d="M 108 14
             L 194 14
             C 222 14 240 32 240 60
             C 240 88 222 106 194 106
             L 150 106
             L 150 148
             L 108 148
             L 108 106
             L 108 60 Z
             M 150 48
             L 150 72
             L 186 72
             C 198 72 206 66 206 60
             C 206 54 198 48 186 48 Z" 
          fill="#ffffff" />

    <!-- Red Person / Pin in Center of 'O' -->
    <circle cx="60" cy="58" r="16" fill="#e11d48" />
    <path d="M 60 80
             L 84 126
             L 36 126 Z" 
          fill="#e11d48" />
  </g>

  <!-- "AutoPost Studio" Typography -->
  <g id="brand-text" transform="translate(300, 202)" text-anchor="middle">
    <text x="0" y="0" 
          font-family="'Plus Jakarta Sans', 'Syne', sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="#ffffff">
      AutoPost Studio
    </text>
    <!-- Red dot in the counter of 'o' in Auto -->
    <circle cx="-103" cy="-13" r="5.5" fill="#e11d48" />
  </g>

  <!-- Subtitle: by CabaLink & handle -->
  <g id="brand-sub" transform="translate(300, 230)" text-anchor="middle">
    <text x="0" y="0"
          font-family="'Plus Jakarta Sans', sans-serif"
          font-size="14"
          font-weight="700"
          letter-spacing="2"
          fill="#d4d4d8">
      BY CABALINK · @CABALINK / @CABA_LINK
    </text>
  </g>
</svg>
