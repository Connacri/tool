apply plugin: 'com.android.application'

// Lecture des identifiants de signature de release depuis android/keystore.properties,
// un fichier volontairement EXCLU du dépôt Git (voir .gitignore) car il contient le
// mot de passe du keystore. Sans ce fichier, seul le build "debug" (non signé pour la
// production, donc non publiable sur Play Store) reste utilisable — c'est le
// comportement attendu tant que le développeur n'a pas généré et renseigné son propre
// keystore de release (voir android/KEYSTORE_README.md pour la procédure complète).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Version de l'application.
//
// La source de verite est le tag Git (format SemVer : v1.2.3), converti par
// scripts/version.mjs qui produit un versionName et un versionCode. La CI
// injecte les deux via -PAPP_VERSION_NAME / -PAPP_VERSION_CODE au moment du
// build, ce qui garantit que l'APK, l'AAB et la GitHub Release portent
// exactement la meme version.
//
// Les valeurs de repli ci-dessous servent aux builds locaux et au debug : elles
// doivent rester alignees sur la derniere version publiee, sinon Play refusera
// l'upload (le versionCode doit etre strictement croissant).
def appVersionName = project.findProperty("APP_VERSION_NAME") ?: "1.0.0"
def appVersionCode = project.findProperty("APP_VERSION_CODE") ?: "1000000"
def appVersionCodeInt = appVersionCode.toString().toInteger()
if (appVersionCodeInt < 1) {
    throw new GradleException("APP_VERSION_CODE doit etre >= 1, recu : ${appVersionCodeInt}")
}

android {
    namespace = "com.autopost.studio"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.autopost.studio"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCodeInt
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Firebase Android. Declenchees seulement si le fichier de configuration
    // existe (voir l'appel conditionnel du plugin plus bas) : sans lui, le
    // module compile, mais Analytics et Performance n'ont ni SDK ni cle, et
    // aucun evenement n'est envoye.
    //
    // Le BoM fixe les versions entre elles, ce qui evite le cas classique
    // d'un firebase-analytics 23.x avec un firebase-core 22.x : Firebase
    // refuse de demarrer dans cette situation, et l'erreur est extremement
    // difficile a relier a sa cause reelle.
    if (file('google-services.json').exists()) {
        implementation platform('com.google.firebase:firebase-bom:34.19.0')
        // Rattachement des evenements a un profil d'utilisateur, pour mesurer
        // les conversions annoncees dans l'ecran A propos de.
        implementation 'com.google.firebase:firebase-analytics'
        // Traces de performance : demarrage de l'app, rendu de l'ecran, appels
        // reseau lents. Necessite la SHA-1 du certificat de signature
        // enregistree dans la console Firebase, sinon aucun evenement n'arrive.
        implementation 'com.google.firebase:firebase-perf'
    }
}

apply from: 'capacitor.build.gradle'

// Le fichier de configuration est optionnel : sans lui, l'application compile
// et fonctionne, mais sans Firebase. Avec lui, le plugin rend sa
// configuration au SDK Android, ce qui active Analytics et Performance.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle(
        'google-services.json absent : Firebase Android desactive ' +
        '(Analytics et Performance ne remonteront rien). Attendu dans ' +
        'android/app/google-services.json pour le paquet com.autopost.studio.'
    )
}
