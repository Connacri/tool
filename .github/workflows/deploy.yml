name: CI/CD Web & Android (APK + AAB)

on:
  push:
    branches: [main, master]
    # Un tag SemVer (v1.2.3) declenche une build ET la publication de la
    # GitHub Release correspondante.
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:

concurrency:
  # Un groupe par run et non par ref : chaque push obtient son propre groupe.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  # Ne jamais annuler un run en cours. Avec « cancel-in-progress », deux
  # pushs rapproches sur main font annuler le premier, qui ne publie alors
  # aucune release : l'APK de ce commit n'existe nulle part, et son versionCode
  # reste inutilise. Le group ci-dessus est ainsi purement decoratif.
  cancel-in-progress: false

jobs:
  # ==============================================================
  # JOB 0 : Resolution de la version, partagee par les deux builds
  # ==============================================================
  #
  # Pourquoi un job dedie plutot qu'une resolution dans chaque job :
  #
  # Le site et l'APK doivent afficher la MEME version pour un meme commit.
  # Resoudre la version des deux cotes Independamment produit deux valeurs
  # differentes : le site ignorait purement et simplement VITE_APP_VERSION, si
  # bien que « A propos » y affichait « production » (le mode Vite) pendant que
  # l'APK affichait « 1.0.5-ci.3 ». Deux versions affichees pour un meme
  # commit, et aucune ne reliant le site a l'APK qu'il Hernie.
  #
  # Le risque le plus serieux est ailleurs. Chaque build de main attribue un
  # versionCode en relevent les slots deja occupes dans les releases
  # existantes. Si le site et l'APK interrogeaient cette source chacun de leur
  # cote, ils trouveraient le meme premier slot libre et consommeraient DEUX FOIS
  # le meme versionCode. Google Play refuse alors le second APK, trois jours
  # plus tard, sans lien visible avec la cause.
  #
  # Une seule resolution, executee une fois, supprime les deux problemes : les
  # deux builds recoivent la meme version et un seul slot est consomme.
  resolve-version:
    name: 🔢 Résolution de la version
    runs-on: ubuntu-latest
    # Sans permission d'ecriture : ce job ne fait que lire les tags et l'API.
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.version.outputs.raw }}
      version_code: ${{ steps.version.outputs.VERSION_CODE }}
      is_prerelease: ${{ steps.version.outputs.IS_PRERELEASE }}
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4
        with:
          # Les tags sont la source de verite du versionnage. Sans fetch-depth 0,
          # le clone est superficiel et « git tag --list » ne renvoie rien, ce qui
          # faisait retomber les builds sur 1.0.0 au lieu de la derniere version
          # reellement publiee.
          fetch-depth: 0

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resoudre la version de l'application
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RESOLVED="$(node scripts/version.mjs "${{ github.ref_name }}")"
          else
            # Hors tag : c'est un build de main. On repart de la derniere version
            # publiee et on passe par le mode --ci, qui attribue un versionCode
            # libre dans la plage reservee a cette version.
            BASE_VERSION="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"
            if [ -z "$BASE_VERSION" ]; then
              echo "::error::Aucun tag v* trouve. Le versionCode du build serait faux : verifier que le checkout recupere bien les tags (fetch-depth: 0)." >&2
              exit 1
            fi

            # Les slots de CI deja occupes sont relus dans les noms des releases
            # existantes, et non dans les tags : un build de main ne cree aucun
            # tag, et c'est precisement ce qui avait produit les tags build-*
            # parasites. GITHUB_RUN_NUMBER n'est pas utilise non plus, il est
            # sans borne et deborderait la plage de neuf codes.
            #
            # On interroge l'API GitHub plutot que « gh release list » : « gh »
            # exige un GH_TOKEN explicite dans un workflow et ne l'est pas ici,
            # ce qui faisait echouer le run en exit 4. L'API, elle, est une
            # lecture publique sur un depot public : aucun secret a ajouter a
            # une etape de build.
            BASE_TRIMMED="${BASE_VERSION#v}"
            USED_SLOTS="$(
              curl -fsSL --retry 3 --max-time 30 \
                -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                | node scripts/ci-slots.mjs "$BASE_TRIMMED"
            )"
            echo "Slots de CI deja occupes pour $BASE_TRIMMED : ${USED_SLOTS:-aucun}"
            RESOLVED="$(node scripts/version.mjs --ci "$BASE_VERSION" "$USED_SLOTS")"
          fi
          # Le script ecrit ses variables sur stdout. Elles sont reportees dans
          # $GITHUB_OUTPUT, seul moyen de les relire depuis les jobs qui dependent
          # de celui-ci. Aucune dependance n'est installee ici : version.mjs et
          # ci-slots.mjs n'utilisent que les modules natifs de Node.
          echo "$RESOLVED" | tee -a "$GITHUB_OUTPUT"
          # Android n'attend pas de prefixe « v » dans le versionName : le tag
          # git peut le porter, pas le nom affiche dans la Play Console ni dans
          # l'ecran « A propos ».
          RAW_VERSION="$(printf '%s\n' "$RESOLVED" | sed -n 's/^VERSION_NAME=//p')"
          echo "raw=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "Version resolue : $RAW_VERSION (versionCode $(printf '%s\n' "$RESOLVED" | sed -n 's/^VERSION_CODE=//p'))"

  # ==============================================================
  # JOB 1 : Déploiement Web GitHub Pages
  # ==============================================================
  deploy-web:
    name: 🌐 Déploiement GitHub Pages
    # Un tag ne redéploie pas le site : le build de vérification et la
    # publication de la release suffisent. Le déploiement Pages est réservé
    # aux pushs sur la branche principale, seule référence autorisée par
    # l'environnement github-pages.
    if: github.ref_type != 'tag'
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler le site web pour GitHub Pages
        run: npm run build
        env:
          # Repris du job de resolution, jamais recalcule ici : c'est ce qui
          # garantit que le site affiche la version de l'APK du meme commit.
          VITE_APP_VERSION: ${{ needs.resolve-version.outputs.version_name }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
          VITE_ADMOB_APP_OPEN_ID: ${{ vars.VITE_ADMOB_APP_OPEN_ID || secrets.VITE_ADMOB_APP_OPEN_ID }}
          VITE_ADMOB_INTERSTITIAL_ID: ${{ vars.VITE_ADMOB_INTERSTITIAL_ID || secrets.VITE_ADMOB_INTERSTITIAL_ID }}
          VITE_ADSENSE_CLIENT_ID: ${{ vars.VITE_ADSENSE_CLIENT_ID || secrets.VITE_ADSENSE_CLIENT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_ANALYTICS_ENABLED: ${{ vars.VITE_FIREBASE_ANALYTICS_ENABLED || 'true' }}
          VITE_FIREBASE_PERFORMANCE_ENABLED: ${{ vars.VITE_FIREBASE_PERFORMANCE_ENABLED || 'true' }}

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléverser l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ==============================================================
  # JOB 2 : Build Android Natif (APK Débug + Release Signé & AAB)
  # ==============================================================
  build-android:
    name: 📱 Build Android (APK & AAB)
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Configurer Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Vérifier la présence du lockfile
        run: |
          # Le lockfile a déjà disparu deux fois par erreur (f4a0c8f, puis
          # d278012). Sans lui, `cache: 'npm'` échoue avec un message peu
          # explicite et l'install n'est plus reproductible. On le dit donc
          # clairement avant que setup-node ne lève son erreur.
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json est absent du dépôt. Le générer avec 'npm install --package-lock-only' puis le committer."
            exit 1
          fi

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler l'application web pour Android (chemins relatifs)
        run: npm run build:mobile
        env:
          # Repris du job de resolution : le site et l'APK sont construits dans
          # le meme run et doivent embarquer la MEME version. Les deux flags
          # Analytics/Performance sont aussi repris ici, alors qu'ils n'etaient
          # poses que pour le build web : sans cela, l'APK ne pouvait pas etre
          # coupe alors que le site pouvait l'etre.
          VITE_APP_VERSION: ${{ needs.resolve-version.outputs.version_name }}
          VITE_FIREBASE_ANALYTICS_ENABLED: ${{ vars.VITE_FIREBASE_ANALYTICS_ENABLED || 'true' }}
          VITE_FIREBASE_PERFORMANCE_ENABLED: ${{ vars.VITE_FIREBASE_PERFORMANCE_ENABLED || 'true' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
          VITE_ADMOB_APP_OPEN_ID: ${{ vars.VITE_ADMOB_APP_OPEN_ID || secrets.VITE_ADMOB_APP_OPEN_ID }}
          VITE_ADMOB_INTERSTITIAL_ID: ${{ vars.VITE_ADMOB_INTERSTITIAL_ID || secrets.VITE_ADMOB_INTERSTITIAL_ID }}
          VITE_ADSENSE_CLIENT_ID: ${{ vars.VITE_ADSENSE_CLIENT_ID || secrets.VITE_ADSENSE_CLIENT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Synchroniser Capacitor avec le projet Android
        run: npx cap sync android

      - name: Configurer les permissions d'exécution de Gradlew
        run: chmod +x android/gradlew

      - name: Configurer le Keystore de signature
        run: |
          mkdir -p android
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Utilisation du keystore de signature fourni via les secrets GitHub..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/autopost-studio-release.keystore
            cat <<EOF > android/keystore.properties
          storeFile=autopost-studio-release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          else
            echo "Aucun secret de signature : génération d'un Keystore de release CI valide et signé..."
            keytool -genkeypair -v \
              -keystore android/autopost-studio-release.keystore \
              -alias autopost_studio \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storetype PKCS12 \
              -storepass autopoststudio123 \
              -keypass autopoststudio123 \
              -dname "CN=AutoPost Studio, OU=Mobile, O=AutoPost, L=Oran, S=Oran, C=DZ"
            cat <<EOF > android/keystore.properties
          storeFile=autopost-studio-release.keystore
          storePassword=autopoststudio123
          keyAlias=autopost_studio
          keyPassword=autopoststudio123
          EOF
          fi
          cp android/autopost-studio-release.keystore autopost-studio-release.keystore

      - name: Verifier que le bundle web courant est bien embarque
        run: |
          # Les bundles Vite portent un nom hache : a chaque build un nouveau
          # index-<hash>.js apparait, et l'ancien peut rester sur place. Sans
          # cette verif, l'APK embarquerait un bundle perime sans le dire.
          grep -o 'assets/index-[A-Za-z0-9_-]*\.js' android/app/src/main/assets/public/index.html
          test "$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' android/app/src/main/assets/public/index.html | sort -u | wc -l)" -eq 1

      # La version a deja ete resolue une seule fois, dans le job
      # « resolve-version », dont ce job depend. La relire ici empeche toute
      # divergence : le bundle web, le versionCode Gradle et le nom de la
      # release viennent de la meme source, pour le meme commit.
      - name: Reutiliser la version resolue
        id: version
        env:
          RESOLVED_VERSION_NAME: ${{ needs.resolve-version.outputs.version_name }}
          RESOLVED_VERSION_CODE: ${{ needs.resolve-version.outputs.version_code }}
          RESOLVED_IS_PRERELEASE: ${{ needs.resolve-version.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          if [ -z "$RESOLVED_VERSION_NAME" ] || [ -z "$RESOLVED_VERSION_CODE" ]; then
            echo "::error::Version non transmise par le job resolve-version : le build utiliserait une version fausse ou vide." >&2
            exit 1
          fi
          {
            echo "VERSION_NAME=$RESOLVED_VERSION_NAME"
            echo "VERSION_CODE=$RESOLVED_VERSION_CODE"
            echo "IS_PRERELEASE=$RESOLVED_IS_PRERELEASE"
          } | tee -a "$GITHUB_OUTPUT" | tee -a "$GITHUB_ENV"
          # Android n'attend pas de prefixe « v » dans le versionName. Le job de
          # resolution le retire deja ; ce controle reste, parce qu'un « v »
          # resterait invisible jusqu'a l'upload sur le Play Console.
          echo "raw=$RESOLVED_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "android_name=${RESOLVED_VERSION_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "Version : $RESOLVED_VERSION_NAME (versionCode $RESOLVED_VERSION_CODE)"

      - name: Compiler l'APK Debug (installable immédiatement)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon -PAPP_VERSION_NAME="${{ steps.version.outputs.android_name }}" -PAPP_VERSION_CODE="${{ steps.version.outputs.VERSION_CODE }}"

      - name: Compiler l'APK Release signé
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -PAPP_VERSION_NAME="${{ steps.version.outputs.android_name }}" -PAPP_VERSION_CODE="${{ steps.version.outputs.VERSION_CODE }}"

      - name: Compiler l'AAB Release signé (Android App Bundle pour Google Play)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon -PAPP_VERSION_NAME="${{ steps.version.outputs.android_name }}" -PAPP_VERSION_CODE="${{ steps.version.outputs.VERSION_CODE }}"

      # Les noms de fichiers portent la version : plusieurs versions peuvent
      # ainsi coexister dans le telechargement de l'utilisateur sans se
      # confondre, et Play Console est moins susceptible de melanger deux
      # bundles lors d'un upload manuel.
      - name: Nommer les binaires avec la version
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.raw }}"
          cd android/app/build/outputs
          cp apk/release/app-release.apk "apk/release/autopost-studio-$V.apk"
          cp bundle/release/app-release.aab "bundle/release/autopost-studio-$V.aab"
          echo "Binaires :"
          ls -lh "apk/release/autopost-studio-$V.apk" "bundle/release/autopost-studio-$V.aab"

      - name: Verifier la signature des binaires produits
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.raw }}"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "android/app/build/outputs/apk/release/autopost-studio-$V.apk" | tee -a "$GITHUB_STEP_SUMMARY"
          # Un artefact non signe ou signe avec une autre cle doit faire echouer
          # le build, pas passer inapercu.
          "$APKSIGNER" verify "android/app/build/outputs/apk/release/autopost-studio-$V.apk"
          jarsigner -verify "android/app/build/outputs/bundle/release/autopost-studio-$V.aab"
          echo "Signature APK et AAB verifiee." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Téléverser les APKs (Debug & Release)
        uses: actions/upload-artifact@v4
        with:
          name: AutoPost-Studio-APK
          path: |
            android/app/build/outputs/apk/release/autopost-studio-${{ steps.version.outputs.raw }}.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Téléverser le bundle AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: AutoPost-Studio-AAB
          path: android/app/build/outputs/bundle/release/autopost-studio-${{ steps.version.outputs.raw }}.aab
          if-no-files-found: error
          retention-days: 90

      # ==============================================================
      # Identite de la release, differente selon le declencheur.
      # ==============================================================
      - name: Determiner l'identite de la release
        id: release
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.raw }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=v${{ github.ref_name }}"          >> "$GITHUB_OUTPUT"
            echo "name=AutoPost Studio $VERSION"      >> "$GITHUB_OUTPUT"
          else
            # Une release GitHub porte toujours un tag, il n'existe pas de
            # release sans tag. « build-<run> » est donc unavoidable — mais c'est
            # un tag bien forme et sans ambiguite, alors que le « build-40-<sha> »
            # d'origine etait un tag a moitie aleatoire difficile a relier a un
            # build. Ce qui compte est que ces tags restent hors du calcul de
            # version, ce que garantit le glob « v* » de l'etape de version.
            echo "tag=build-${{ github.run_number }}"  >> "$GITHUB_OUTPUT"
            echo "name=AutoPost Studio $VERSION (build ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
          fi

      # ==============================================================
      # Les artefacts Actions expirent au bout de 90 jours. Les pièces
      # jointes d'une GitHub Release, elles, n'expirent jamais : c'est le
      # seul endroit où conserver durablement l'APK et l'AAB signés.
      #
      # Publication dans les deux cas, mais pas de la même façon :
      #
      #  - sur un tag v* : release SemVer propre, c'est la version officielle ;
      #  - sur un push vers main : release d'archive, marquée prerelease et
      #    nommée « build N », pour ne jamais être confondue avec une version
      #    officielle.
      #
      # Une release GitHub exige un tag, donc ces builds créent un tag « build-N ».
      # Il ne pollue pas l'historique des versions : le calcul de versionCode ne
      # lit que les tags « v* » (voir « Resoudre la version de l'application »),
      # et le relecteur de slots ignore ces tags au profit des noms de release.
      - name: Publier la GitHub Release (APK + AAB)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          commit: ${{ github.sha }}
          # Une prerelease SemVer (1.2.0-rc.1) est marquee comme telle sur
          # GitHub, ce qui evite qu'elle soit prise pour une version stable. Les
          # builds de main le sont aussi, pour la meme raison.
          prerelease: ${{ steps.version.outputs.IS_PRERELEASE == 'true' }}
          fail_on_unmatched_files: false
          body: |
            Version `${{ steps.version.outputs.raw }}`
            (versionCode `:${{ steps.version.outputs.VERSION_CODE }}`) — build automatique depuis le commit `${{ github.sha }}`.

            | Fichier | Usage |
            |---|---|
            | `autopost-studio-${{ steps.version.outputs.raw }}.apk` | Installation directe sur un appareil (sideloading) |
            | `autopost-studio-${{ steps.version.outputs.raw }}.aab` | **Fichier à uploader sur Google Play Console** |

            Installation manuelle : Android refuse de remplacer une application déjà
            installée si la clé de signature change. Désinstaller l'ancienne version
            avant d'en installer une nouvelle.
          files: |
            android/app/build/outputs/apk/release/autopost-studio-${{ steps.version.outputs.raw }}.apk
            android/app/build/outputs/bundle/release/autopost-studio-${{ steps.version.outputs.raw }}.aab
